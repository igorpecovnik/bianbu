name: Build Repository Update Docker Images

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  build-images:
    name: "Build ${{ matrix.release }}-${{ matrix.arch }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Debian images
          - release: bookworm
            arch: amd64
            base_image: debian:bookworm
          - release: bookworm
            arch: arm64
            base_image: debian:bookworm
          - release: bookworm
            arch: armhf
            base_image: debian:bookworm
          - release: bullseye
            arch: amd64
            base_image: debian:bullseye
          - release: bullseye
            arch: arm64
            base_image: debian:bullseye

          # Ubuntu images
          - release: jammy
            arch: amd64
            base_image: ubuntu:jammy
          - release: jammy
            arch: arm64
            base_image: ubuntu:jammy
          - release: jammy
            arch: armhf
            base_image: ubuntu:jammy
          - release: noble
            arch: amd64
            base_image: ubuntu:noble
          - release: noble
            arch: arm64
            base_image: ubuntu:noble

    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Dockerfile
        run: |
          cat > Dockerfile <<EOF
          FROM ${{ matrix.base_image }}

          ENV ARCH=${{ matrix.arch }} \\
              DEBIAN_FRONTEND=noninteractive

          # Install essential packages
          RUN apt-get update && apt-get install -y \\
              wget \\
              gnupg \\
              dirmngr \\
              ca-certificates \\
              unzip \\
              rsync \\
              openssh-client \\
              xz-utils \\
              bzip2 \\
              git \\
              curl \\
              jq \\
              sudo \\
              && rm -rf /var/lib/apt/lists/*

          # Install Aptly from GitHub (multi-arch)
          RUN APTLY_VERSION="1.6.2" && \\
              APTLY_URL="https://github.com/aptly-dev/aptly/releases/download/v\${APTLY_VERSION}" && \\
              case "\$(dpkg --print-architecture)" in \\
                amd64|x86_64) \\
                  APTLY_ARCH="amd64" ;; \\
                arm64|aarch64) \\
                  APTLY_ARCH="arm64" ;; \\
                armhf|armv7l) \\
                  APTLY_ARCH="armhf" ;; \\
                *) \\
                  echo "Unsupported architecture" && exit 1 ;; \\
              esac && \\
              wget -qO /tmp/aptly.zip "\${APTLY_URL}/aptly_\${APTLY_VERSION}_linux_\${APTLY_ARCH}.zip" && \\
              unzip -q /tmp/aptly.zip -d /tmp/aptly && \\
              install -m 0755 /tmp/aptly/aptly_*_linux_\${APTLY_ARCH}/aptly /usr/local/bin/aptly && \\
              rm -rf /tmp/aptly /tmp/aptly.zip && \\
              aptly version

          # Install GitHub CLI
          RUN curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | \\
              dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg && \\
              chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg && \\
              echo "deb [arch=\$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" > /etc/apt/sources.list.d/github-cli.list && \\
              apt-get update && \\
              apt-get install -y gh && \\
              rm -rf /var/lib/apt/lists/*

          WORKDIR /workspace
          CMD ["/bin/bash"]
          EOF

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/${{ matrix.arch }}
          tags: |
            ${{ env.REGISTRY }}/armbian/repository-update:${{ matrix.release }}-${{ matrix.arch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: true
          load: false

      - name: Image built
        run: |
          echo "::notice::Built armbian/repository-update:${{ matrix.release }}-${{ matrix.arch }}"
          echo "::notice::Pushed to registry"

  summary:
    name: "Build Summary"
    needs: build-images
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Generate summary
        run: |
          echo '# Docker Images Built' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '| Release | Arch | Image |' >> $GITHUB_STEP_SUMMARY
          echo '|---------|------|-------|' >> $GITHUB_STEP_SUMMARY
          echo '| bookworm | amd64 | armbian/repository-update:bookworm-amd64 |' >> $GITHUB_STEP_SUMMARY
          echo '| bookworm | arm64 | armbian/repository-update:bookworm-arm64 |' >> $GITHUB_STEP_SUMMARY
          echo '| bookworm | armhf | armbian/repository-update:bookworm-armhf |' >> $GITHUB_STEP_SUMMARY
          echo '| bullseye | amd64 | armbian/repository-update:bullseye-amd64 |' >> $GITHUB_STEP_SUMMARY
          echo '| bullseye | arm64 | armbian/repository-update:bullseye-arm64 |' >> $GITHUB_STEP_SUMMARY
          echo '| jammy | amd64 | armbian/repository-update:jammy-amd64 |' >> $GITHUB_STEP_SUMMARY
          echo '| jammy | arm64 | armbian/repository-update:jammy-arm64 |' >> $GITHUB_STEP_SUMMARY
          echo '| jammy | armhf | armbian/repository-update:jammy-armhf |' >> $GITHUB_STEP_SUMMARY
          echo '| noble | amd64 | armbian/repository-update:noble-amd64 |' >> $GITHUB_STEP_SUMMARY
          echo '| noble | arm64 | armbian/repository-update:noble-arm64 |' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '✅ Images pushed to GitHub Container Registry' >> $GITHUB_STEP_SUMMARY
