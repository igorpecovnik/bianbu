name: Build Armbian Image
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: armbian/build@actions
        with:
          armbian_token: ${{ secrets.GITHUB_TOKEN }}
          armbian_board: "bananapif3"
          armbian_target: "build"
          armbian_runner_clean: "yes"
